[tool.poetry]
name = "vibecoder-generation"
version = "0.1.0"
description = "LLM generation with citation grounding for Vibe Coder"
authors = ["Vibe Coder"]
packages = [{ include = "generation", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.7.0"
httpx = "^0.27.0"
openai = "^1.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"