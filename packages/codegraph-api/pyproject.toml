[project]
name = "codegraph-api"
version = "0.1.0"
description = "CodeGraph FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pydantic==2.8.2",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "codegraph-parser @ file://../codegraph-parser",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]