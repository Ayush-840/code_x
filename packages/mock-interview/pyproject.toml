[tool.poetry]
name = "vibecoder-mock-interview"
version = "0.1.0"
description = "Mock interview engine for Vibe Coder (personas, scoring, reports)"
authors = ["Vibe Coder"]
packages = [{ include = "mock_interview", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"