[project]
name = "codegraph-parser"
version = "0.1.0"
description = "CodeGraph parser using tree-sitter"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
    "networkx==3.3",
    "pydantic==2.8.2",
    "pathspec>=0.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]