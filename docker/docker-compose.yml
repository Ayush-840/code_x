services:
  postgres:
    image: postgres:16-alpine
    container_name: vibecoder-postgres
    environment:
      POSTGRES_USER: vibecoder
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: vibecoder_dev
    ports:
      - "5433:5432"
    volumes:
      - vibecoder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecoder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vibecoder-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: vibecoder-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - vibecoder-osdata:/usr/share/opensearch/data

volumes:
  vibecoder-pgdata:
  vibecoder-osdata: