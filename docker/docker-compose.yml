services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vibecoder-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibecoder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-vibecoder_dev}
    ports:
      - "5433:5432"
    volumes:
      - vibecoder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibecoder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vibecoder-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application Services ───────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: vibecoder-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibecoder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vibecoder_dev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your .env file}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set in your .env file}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set in your .env file}
      FRONTEND_URL: http://localhost:3000
      ANALYSIS_SERVICE_URL: http://analysis:8100
      RETRIEVAL_SERVICE_URL: http://retrieval:8200
      GENERATION_SERVICE_URL: http://generation:8300
      MOCK_INTERVIEW_SERVICE_URL: http://mock-interview:8400
      CODEGRAPH_SERVICE_URL: http://codegraph:8500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  websocket:
    build:
      context: ..
      dockerfile: apps/websocket/Dockerfile
    container_name: vibecoder-websocket
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your .env file}
      FRONTEND_URL: http://localhost:3000
      GENERATION_SERVICE_URL: http://generation:8300
      MOCK_INTERVIEW_SERVICE_URL: http://mock-interview:8400
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: vibecoder-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibecoder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vibecoder_dev}
      REDIS_URL: redis://redis:6379
      ANALYSIS_SERVICE_URL: http://analysis:8100
      RETRIEVAL_SERVICE_URL: http://retrieval:8200
      GENERATION_SERVICE_URL: http://generation:8300
      CODEGRAPH_SERVICE_URL: http://codegraph:8500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analysis:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE: analysis
    container_name: vibecoder-analysis
    ports:
      - "8100:8100"
    environment:
      RETRIEVAL_SERVICE_URL: http://retrieval:8200

  retrieval:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE: retrieval
    container_name: vibecoder-retrieval
    ports:
      - "8200:8200"
    environment:
      RETRIEVAL_STORAGE_DIR: /tmp/vibecoder-retrieval
      NVIDIA_API_KEYS: ${NVIDIA_API_KEYS:-}
    volumes:
      - vibecoder-retrieval-data:/tmp/vibecoder-retrieval

  generation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE: generation
    container_name: vibecoder-generation
    ports:
      - "8300:8300"
    environment:
      RETRIEVAL_SERVICE_URL: http://retrieval:8200
      NVIDIA_API_KEYS: ${NVIDIA_API_KEYS:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  mock-interview:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE: mock-interview
    container_name: vibecoder-mock-interview
    ports:
      - "8400:8400"

  # Repo-keyed dependency graph + LLM explain/chat. Shares the python-all
  # image's dependency set is NOT available here — this builds from its own
  # source on the shared Dockerfile.python pattern.
  codegraph:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE: codegraph
    container_name: vibecoder-codegraph
    ports:
      - "8500:8500"
    environment:
      CODEGRAPH_STORAGE_DIR: /tmp/vibecoder-codegraph
      NVIDIA_API_KEYS: ${NVIDIA_API_KEYS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - vibecoder-codegraph-data:/tmp/vibecoder-codegraph

  web:

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: vibecoder-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4001
    depends_on:
      api:
        condition: service_started

volumes:
  vibecoder-pgdata:
  vibecoder-retrieval-data:
  vibecoder-codegraph-data:
