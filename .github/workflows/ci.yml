name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Dependency Audit Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` input — package.json's packageManager field is the single
      # source of truth; specifying both aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies (needed for direct-dep detection)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run dependency audit gate
        run: pnpm audit:gate

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # seed.ts imports ../generated, which only exists after prisma generate.
      - run: pnpm --filter @vibe-coder/database exec prisma generate
      # api/worker/websocket import @vibe-coder/shared, whose dist/ is built.
      - run: pnpm --filter @vibe-coder/shared build
      - run: pnpm -r typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibecoder
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vibecoder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vibecoder:test_password@localhost:5432/vibecoder_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-for-ci-only-32chars!!
      GITHUB_CLIENT_ID: test-client-id
      GITHUB_CLIENT_SECRET: test-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibe-coder/database exec prisma generate
      - run: pnpm --filter @vibe-coder/database exec prisma migrate deploy
      - run: pnpm -r test

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: |
          for svc in analysis retrieval generation mock-interview; do
            (cd packages/$svc && poetry install --no-root)
          done
      - name: Run Python tests
        run: |
          for svc in analysis retrieval generation mock-interview; do
            (cd packages/$svc && poetry run pytest tests/ -v 2>/dev/null || echo "No tests found for $svc")
          done
