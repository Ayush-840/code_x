# ⚠️ Reference only — NOT the active deployment target.
# The site runs on Vercel (frontend) + Railway (backend) — see
# VIBE_CODER_ENV_MATRIX.md and .railway/railway.ts for the live configuration.
# This file is kept because Vibe_Coder_TRD_Vercel_Railway.md uses it as the
# reference for which env vars each service needs. The FRONTEND_URL values
# below are placeholders — never wire this into Render without replacing them
# (and the GitHub OAuth callback) with real values first.
services:
  - type: web
    name: vibecoder-api
    runtime: image
    image:
      url: ghcr.io/ayush-840/code_x-api:latest
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: vibecoder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vibecoder-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Must be exact origins (comma-separated), not a wildcard — cors()
      # rejects non-exact matches and withCredentials:true forbids "*".
      - key: FRONTEND_URL
        value: "https://vibecoder.vercel.app"
      - key: API_URL
        value: "https://vibecoder-api.onrender.com"
      - key: ANALYSIS_SERVICE_URL
        value: "http://vibecoder-python:8100"
      - key: RETRIEVAL_SERVICE_URL
        value: "http://vibecoder-python:8200"
      - key: GENERATION_SERVICE_URL
        value: "http://vibecoder-python:8300"
      - key: MOCK_INTERVIEW_SERVICE_URL
        value: "http://vibecoder-python:8400"
    healthCheckPath: /v1/auth/me
    autoDeploy: true

  - type: web
    name: vibecoder-websocket
    runtime: image
    image:
      url: ghcr.io/ayush-840/code_x-websocket:latest
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: REDIS_URL
        fromService:
          name: vibecoder-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          name: vibecoder-api
          property: envVars.JWT_SECRET
      # Must be exact origins (comma-separated), not a wildcard — cors()
      # rejects non-exact matches and withCredentials:true forbids "*".
      - key: FRONTEND_URL
        value: "https://vibecoder.vercel.app"
      - key: MOCK_INTERVIEW_SERVICE_URL
        value: "http://vibecoder-python:8400"
    autoDeploy: true

  - type: web
    name: vibecoder-python
    runtime: image
    image:
      url: ghcr.io/ayush-840/code_x-python:latest
    envVars:
      - key: NVIDIA_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RETRIEVAL_STORAGE_DIR
        value: /tmp/vibecoder-retrieval
    autoDeploy: true

  - type: web
    name: vibecoder-worker
    runtime: image
    image:
      url: ghcr.io/ayush-840/code_x-worker:latest
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vibecoder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vibecoder-redis
          property: connectionString
      - key: ANALYSIS_SERVICE_URL
        value: "http://vibecoder-python:8100"
      - key: RETRIEVAL_SERVICE_URL
        value: "http://vibecoder-python:8200"
      - key: GENERATION_SERVICE_URL
        value: "http://vibecoder-python:8300"
    autoDeploy: true

  - type: redis
    name: vibecoder-redis
    ipAllowList: []
    plan: starter

  - type: postgresql
    name: vibecoder-db
    databaseName: vibecoder
    plan: starter
